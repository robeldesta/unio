# Unio cloud (local): one Odoo serving many customer companies, each in its own database, chosen by the subdomain
# (acme.unio.localhost -> database "acme"). Enterprise customers keep dedicated stacks.
name: unio
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 10
  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8569:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ../sonador-odoo/addons:/mnt/extra-addons
  site:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8580:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
volumes:
  db-data:
  odoo-data:
